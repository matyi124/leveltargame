name: Minify JS and version with date

on:
  push:
    branches: [ main ]

jobs:
  minify-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Terser
        run: npm install -g terser

      - name: Minify JS files with date
        run: |
          today=$(date +%Y%m%d)
          for f in $(find . -type f -name '*.js' ! -name '*.min.js'); do
            dir=$(dirname "$f")
            base=$(basename "$f" .js)
            out="$dir/$base.$today.min.js"
            terser "$f" -o "$out"
          done
          echo "MINI_DATE=$today" >> $GITHUB_ENV

      - name: Replace script references in HTML
        run: |
          find . -type f -name 'index.html' | while read html; do
            sed -i "s|script.js\"|script.${{ env.MINI_DATE }}.min.js\"|g" "$html"
            sed -i "s|predictor.js\"|predictor.${{ env.MINI_DATE }}.min.js\"|g" "$html"
          done

      - name: Commit changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add ./**/*.min.js
          git add ./**/*.html
          git commit -m "Auto-minify and update HTML with versioned JS" || echo "No changes"
          git push
