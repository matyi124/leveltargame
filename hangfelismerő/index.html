<!DOCTYPE html>

<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hang felismerő kvíz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="vanta.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<div id="vanta-bg"></div>
<div class="container py-4">
<h1 class="text-center mb-4">Hang felismerő kvíz</h1>
<div class="text-center mb-3">
<button class="btn gradient-border-btn" id="playBtn">
      ▶️ Lejátszás
    </button>
</div>
<div class="row g-3 justify-content-center mb-3" id="options"></div>
<div class="text-center fs-4 fw-bold" id="result"></div>
</div>
<script src="script.20250724.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta/dist/vanta.fog.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    VANTA.FOG({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      highlightColor: 0xffc300,
      midtoneColor: 0xfff100,
      lowlightColor: 0x2006ff,
      baseColor: 0x00f1ff,
      blurFactor: 0.5,
      speed: 0.8,
      zoom: 0.8
    });
  });
</script>

</body>
</html>
